<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mission Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        body { background: #000; color: white; font-family: 'Rajdhani'; overflow: hidden; margin: 0; display: flex; height: 100vh; }
        
        /* SIDEBAR (TEAMS) */
        #sidebar { width: 300px; background: #0b0c10; border-right: 2px solid #45a29e; padding: 20px; z-index: 10; }
        .team-card { background: rgba(69, 162, 158, 0.1); border: 1px solid #45a29e; padding: 10px; margin-bottom: 10px; border-radius: 4px; }
        .team-card h3 { margin: 0; font-family: 'Orbitron'; color: #45a29e; }

        /* MAIN SCREEN */
        #main-view { flex-grow: 1; position: relative; background: url('https://images.unsplash.com/photo-1614728853913-1e22ba638843?q=80&w=2070') center/cover; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        h1.big-title { font-family: 'Orbitron'; font-size: 80px; margin: 0; text-shadow: 0 0 30px #45a29e; }
        .mission-text { font-size: 50px; color: #ff2e2e; font-weight: bold; text-shadow: 0 0 20px red; border: 2px solid red; padding: 20px; background: rgba(0,0,0,0.5); }

        /* ADMIN PANEL (Hidden at bottom) */
        #admin-panel { position: absolute; bottom: 0; right: 0; background: #111; padding: 10px; opacity: 0.1; transition: 0.3s; border: 1px solid #444; }
        #admin-panel:hover { opacity: 1; }
        button { background: #333; color: white; border: 1px solid #666; padding: 5px; cursor: pointer; margin: 2px; }

        /* PHOTO APPROVAL MODAL */
        #photo-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: black; border: 2px solid #45a29e; padding: 20px; z-index: 100; text-align: center; display: none; width: 50%; }
        #photo-modal img { max-width: 100%; border: 1px solid #333; margin-bottom: 20px; max-height: 400px; }
        .approve-btn { background: #00ff00; color: black; font-weight: bold; padding: 15px; font-size: 18px; cursor: pointer; }
        .reject-btn { background: #ff0000; color: white; font-weight: bold; padding: 15px; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2 style="color:white; font-family:'Orbitron'">SQUADRON STATUS</h2>
        <div id="teams-list"></div>
    </div>

    <div id="main-view">
        <div id="overlay">
            <h1 class="big-title">RED HORIZON</h1>
            <div class="mission-text" id="display-mission">SYSTEM STANDBY</div>
        </div>
        
        <div id="photo-modal">
            <h2 style="color:#45a29e">INCOMING TRANSMISSION</h2>
            <img id="review-img" src="">
            <br>
            <button class="approve-btn" onclick="judgePhoto('gold')">APPROVE (GOLD)</button>
            <button class="reject-btn" onclick="judgePhoto('silver')">APPROVE (SILVER)</button>
            <button onclick="closeModal()">CANCEL</button>
        </div>

        <div id="admin-panel">
            <h4>GAME MASTER</h4>
            <button onclick="setMission('LEVEL 1: SCAVENGE')">1. SCAVENGE</button>
            <button onclick="setMission('LEVEL 2: HULL BREACH')">2. BREACH</button>
            <button onclick="setMission('LEVEL 3: NAVIGATE')">3. NAVIGATE</button>
            <button onclick="setMission('LEVEL 4: LAUNCH')">4. LAUNCH</button>
        </div>
    </div>

    <script>
        // --- 1. PASTE SAME FIREBASE CONFIG HERE ---
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY_HERE",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // RENDER TEAMS
        db.ref('teams').on('value', snap => {
            const list = document.getElementById("teams-list");
            list.innerHTML = "";
            const teams = snap.val();
            if(teams) {
                Object.keys(teams).forEach(key => {
                    const t = teams[key];
                    const invCount = t.inventory ? Object.keys(t.inventory).length : 0;
                    list.innerHTML += `<div class="team-card"><h3>${t.name}</h3><small>ITEMS: ${invCount}</small></div>`;
                });
            }
        });

        // SET MISSION
        function setMission(txt) {
            db.ref('game_state/current_mission').set(txt);
            document.getElementById("display-mission").innerText = txt;
        }

        // PHOTO APPROVAL LOGIC
        let currentReviewTeam = null;
        db.ref('level_2_submission').on('child_added', (snap) => {
            const data = snap.val();
            if(data.status === 'pending') {
                currentReviewTeam = snap.key;
                document.getElementById("photo-modal").style.display = "block";
                document.getElementById("review-img").src = data.photo_url;
            }
        });

        function judgePhoto(tier) {
            if(currentReviewTeam) {
                db.ref('level_2_submission/' + currentReviewTeam).update({ status: (tier === 'gold') ? 'approved_gold' : 'approved_silver' });
                closeModal();
            }
        }
        function closeModal() { document.getElementById("photo-modal").style.display = "none"; }
    </script>
</body>
</html>
